services:
  - type: web
    name: aiori-ipv6-auditor
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /api/ready
    envVars:
      - key: API_HOST
        value: 0.0.0.0
      - key: ENABLE_TESTBED
        value: "false"
      - key: CLEAN_PORTS
        value: "false"
      - key: RENDER
        value: "true"
      - key: ENABLE_KEEPALIVE
        value: "true"
      - key: KEEP_ALIVE_URL
        value: "https://a3-ps027-tc190.onrender.com"
      - key: KEEPALIVE_INTERVAL_SECONDS
        value: "240"
